<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#0b0d11" />
    </linearGradient>

    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Compass Pointer Gold Gradient -->
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Compass Pointer Dark Gold Gradient -->
    <linearGradient id="compassDarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldRing)" stroke-width="12" />

  <!-- Inner Decorative Map Circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldRing)" stroke-opacity="0.4" stroke-width="4" />

  <!-- Cardinal Points (N, S, E, W Marks) -->
  <circle cx="256" cy="66" r="6" fill="#fbbf24" />
  <circle cx="256" cy="446" r="6" fill="#fbbf24" />
  <circle cx="66" cy="256" r="6" fill="#fbbf24" />
  <circle cx="446" cy="256" r="6" fill="#fbbf24" />

  <!-- Compass Star - North Needle (Bright Top) -->
  <polygon points="256,76 256,256 210,256" fill="url(#goldRing)" filter="url(#goldGlow)" />
  <polygon points="256,76 256,256 302,256" fill="url(#compassDarkGold)" />

  <!-- Compass Star - South Needle -->
  <polygon points="256,436 256,256 302,256" fill="url(#compassGold)" />
  <polygon points="256,436 256,256 210,256" fill="url(#compassDarkGold)" />

  <!-- Compass Star - East Needle -->
  <polygon points="436,256 256,256 256,210" fill="url(#goldRing)" />
  <polygon points="436,256 256,256 256,302" fill="url(#compassDarkGold)" />

  <!-- Compass Star - West Needle -->
  <polygon points="76,256 256,256 256,302" fill="url(#compassGold)" />
  <polygon points="76,256 256,256 256,210" fill="url(#compassDarkGold)" />

  <!-- Diagonal Secondary Star Points (NW, NE, SE, SW) -->
  <polygon points="128,128 256,256 210,256" fill="#f59e0b" opacity="0.8" />
  <polygon points="128,128 256,256 256,210" fill="#78350f" opacity="0.8" />

  <polygon points="384,128 256,256 256,210" fill="#f59e0b" opacity="0.8" />
  <polygon points="384,128 256,256 302,256" fill="#78350f" opacity="0.8" />

  <polygon points="384,384 256,256 302,256" fill="#f59e0b" opacity="0.8" />
  <polygon points="384,384 256,256 256,302" fill="#78350f" opacity="0.8" />

  <polygon points="128,384 256,256 256,302" fill="#f59e0b" opacity="0.8" />
  <polygon points="128,384 256,256 210,256" fill="#78350f" opacity="0.8" />

  <!-- Center Jewel / Dial Ring -->
  <circle cx="256" cy="256" r="32" fill="#0b0d11" stroke="url(#goldRing)" stroke-width="6" />
  <circle cx="256" cy="256" r="16" fill="url(#compassGold)" />
  <circle cx="250" cy="250" r="4" fill="#ffffff" opacity="0.9" />
</svg>